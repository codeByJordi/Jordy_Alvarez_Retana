<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Ingresar')}"></head>
<body>
<section>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-12 col-sm-12">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Restablecer Contraseña</h2>
                        <br/>
                        <br/>
                        <form th:action="@{/restablecer/proceso}" method="post">

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="Ingrese su email"
                                        name="email"
                                        required
                                >
                            </div>
                            <br/>
                            <div class="d-grid gap-2 col-6 mx-lg">
                                <button type="submit" class="btn btn-primary w-100">Restablecer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
