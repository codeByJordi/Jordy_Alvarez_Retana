<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="container my-4" style="max-width: 720px;">
    <h1 class="mb-4">
        <i class="bi bi-mortarboard me-2"></i>
        <span th:text="${libro.id == null} ? 'Nuevo Libro' : 'Editar Libro'">Libro</span>
    </h1>

    <form method="post" th:object="${libro}" th:action="${libro.id == null} ? @{/libros} : @{/{id}(id=${libro.id})}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Titulo del libro</label>
            <input type="text" class="form-control"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                   th:field="*{titulo}"
                   >
            <div class="invalid-feedback" th:errors="*{titulo}">Error</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Autor</label>
            <input class="form-control" type="text"
                      th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid'"
                      th:field="*{autor}">
            <div class="invalid-feedback" th:errors="*{autor}">Error</div>
        </div>


        <div class="row">
            <div class="mb-3">
                <label class="form-label">ISBN</label>
                <input class="form-control" type="text"
                          th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"
                          th:field="*{isbn}">
                <div class="invalid-feedback" th:errors="*{isbn}">Error</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoria</label>
                <input class="form-control" type="text"
                          th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'"
                          th:field="*{categoria}">
                <div class="invalid-feedback" th:errors="*{isbn}">Error</div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Copias totales</label>
                <input type="number" class="form-control" min="1"
                       th:classappend="${#fields.hasErrors('copiasTotales')} ? 'is-invalid'"
                       th:field="*{copiasTotales}">
                <div class="invalid-feedback" th:errors="*{copiasTotales}">Error</div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Copias disponibles</label>
                <input type="number" class="form-control" min="0"
                       th:classappend="${#fields.hasErrors('copiasDisponibles')} ? 'is-invalid'"
                       th:field="*{copiasDisponibles}">
                <div class="invalid-feedback" th:errors="*{copiasDisponibles}">Error</div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/libros}">
                <i class="bi bi-arrow-left me-1"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${libro.id == null} ? 'Crear' : 'Guardar cambios'">Guardar</span>
            </button>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
