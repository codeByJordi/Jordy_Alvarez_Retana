<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="container my-4" style="max-width: 720px;">
    <h1 class="mb-4">
        <i class="bi bi-mortarboard me-2"></i>
        <span th:text="${prestamo.id == null} ? 'Nuevo Prestamo' : 'Editar Prestamo'">Prestamo</span>
    </h1>

    <form method="post"
          th:object="${prestamo}"
          th:action="@{/p/nuevo/post}">

        <input type="hidden" th:field="*{id}">


        <div class="mb-3">
            <span class="form-label">Titulo del Libro</span> </br>
            <h6 th:text="${libro.titulo}"></h6>
            <input type="hidden" name="libro" th:value="${libro.id}">
        </div>
        <div class="mb-3">
            <div class="col-md-8 mb-3">
                <label class="form-label">Usuario</label>

                <select class="form-select" name="usuario"
                        th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid'">
                    <option value="">-- Seleccionar usuario --</option>
                    <option th:each="usuario : ${usuarios}"
                            th:value="${usuario.id}"
                            th:selected="${prestamo.usuario != null and prestamo.usuario.id == usuario.id}"
                            th:text="${usuario.nombreCompleto}">Usuario</option>
                </select>
                <div class="invalid-feedback" th:errors="*{usuario}">Error</div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Fecha Prestamo</label>
            <input type="text"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('fechaPrestamo')} ? 'is-invalid'"
                   th:field="*{fechaPrestamo}">
            <div class="invalid-feedback" th:errors="*{fechaPrestamo}">Error</div>
        </div>
        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/libros}">
                <i class="bi bi-arrow-left me-1"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${prestamo.id == null} ? 'Crear' : 'Guardar cambios'">Guardar</span>
            </button>
        </div>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
