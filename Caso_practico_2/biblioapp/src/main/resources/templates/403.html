<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | SC-403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<main class="container my-5 text-center" style="max-width: 520px;">
    <div class="card shadow border-0">
        <div class="card-body p-5">
            <i class="bi bi-shield-exclamation" style="font-size: 3.5rem; color: #71fbd6;"></i>
            <h1 class="h3 mt-3 mb-2">403 - Acceso denegado</h1>
            <p class="text-muted">
                Tu usuario esta logueado, pero no tiene el rol necesario para
                hacer esta accion (registrar un prestamo o gestionar el
                catalogo requiere el rol <strong>BIBLIOTECARIO</strong>).
            </p>
            <a class="btn btn-primary mt-2" href="/libros">Volver al catalogo</a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
