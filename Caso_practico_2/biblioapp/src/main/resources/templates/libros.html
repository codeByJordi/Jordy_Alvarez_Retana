<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/header :: head('Catalogo')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<div class="container">
    <h1 class="mb-4">Catalogo de libros</h1>

    <!-- ==========================================================
         CASO PRACTICO 2 - BONUS chico (+2):
         Agregar un badge "Sin copias disponibles" cuando
         libro.copiasDisponibles == 0.
         ========================================================== -->

    <a sec:authorize="hasRole('BIBLIOTECARIO')" th:href="@{/libros/nuevo}" class="btn btn-outline-warning btn-lg">Agregar Nuevo Libro</a>
    </br>
    </br>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="libro : ${libros}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${libro.titulo}">Titulo</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${libro.autor}">Autor</h6>
                    <p class="card-text">
                        <span class="badge bg-secondary" th:text="${libro.categoria}">Categoria</span>
                        <span class="badge bg-info text-dark"
                              th:text="${libro.copiasDisponibles} + ' / ' + ${libro.copiasTotales} + ' disponibles'">
                            disponibles
                        </span>
                    </p>

                    <a sec:authorize="hasRole('BIBLIOTECARIO')" th:href="@{/libros/editar/{id} (id=${libro.id})}" class="btn btn-outline-warning btn-sm">Editar</a>
                    <form sec:authorize="hasRole('BIBLIOTECARIO')" th:action="@{/libros/eliminar/{id} (id=${libro.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Eliminar este libro?');">Eliminar</button>
                    </form>

                    <a th:href="@{'/libros/' + ${libro.id}}" class="btn btn-outline-primary btn-sm">Ver detalle</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
