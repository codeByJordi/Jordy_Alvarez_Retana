<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Ingresar')}"></head>
<body>
<section>
 <div class="container mt-5">
    <div class="row justify-content-center">
       <div class="col-lg-10 col-md-12 col-sm-12">
          <div class="card shadow-lg">
             <div class="card-body">
                <h2 class="card-title text-center mb-4">Restablecer Contraseña</h2>
                   <br/>
                    <br/>
                  <div th:if="${mensaje}">
                     <h1 class="h4 mb-3 text-center text-danger">
                         <i class="bi bi-x-circle me-1"></i> Enlace invalido o vencido
                     </h1>
                     <p class="text-muted small text-center">
                                Este enlace ya no es valido. Los enlaces de recuperacion duran 30 minutos
                                y solo se pueden usar una vez.
                     </p>
                     <p class="text-center mb-0">
                         <a th:href="@{/restablecer}" class="btn btn-primary">Pedir un enlace nuevo</a>
                     </p>
                        </div>
                        <div th:unless="${mensaje}">
                            <form th:action="@{/restablecer-password}" method="post">
                                <input type="hidden" name="token" th:value="${token}">
                                <div class="mb-3">
                                    <label for="contrasena" class="form-label">Contraseña</label>
                                    <input
                                            type="text"
                                            class="form-control"
                                            id="contrasena"
                                            placeholder="Ingrese su nueva contraseña"
                                            name="contrasena"
                                            required>
                                </div>
                                <div th:if="${error}" class="form-text" th:text="'La contraseña debe tener al menos 8 caracteres'" style="font-style: italic; color: red"></div>
                                <br/>
                                <div class="d-grid gap-2 col-6 mx-lg">
                                    <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-danger btn-lg"
                                             style="padding-left: 2.5rem; padding-right: 2.5rem;">Restablecer</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
